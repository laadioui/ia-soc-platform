apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ai-soc
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web-ui
    app.kubernetes.io/part-of: ai-soc-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: web-ui
        app.kubernetes.io/part-of: ai-soc-platform
    spec:
      containers:
        - name: frontend
          image: ai-soc-platform/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend.ai-soc.svc.cluster.local:8000"
            - name: NEXT_PUBLIC_WS_URL
              value: "ws://backend.ai-soc.svc.cluster.local:8000"
            - name: NEXT_PUBLIC_KEYCLOAK_URL
              value: "http://keycloak.ai-soc.svc.cluster.local:8080/auth"
            - name: NEXT_PUBLIC_KEYCLOAK_REALM
              value: "ai-soc"
            - name: NEXT_PUBLIC_KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: ai-soc-config
                  key: KEYCLOAK_CLIENT_ID
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
