apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-soc-config
  namespace: ai-soc
  labels:
    app.kubernetes.io/part-of: ai-soc-platform
data:
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  APP_NAME: ai-soc-platform

  POSTGRES_HOST: postgres.ai-soc.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_USER: aisoc
  POSTGRES_DB: aisoc

  REDIS_HOST: redis.ai-soc.svc.cluster.local
  REDIS_PORT: "6379"

  KAFKA_BOOTSTRAP_SERVERS: kafka.ai-soc.svc.cluster.local:9092
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT

  OPENSEARCH_HOST: opensearch.ai-soc.svc.cluster.local
  OPENSEARCH_PORT: "9200"
  OPENSEARCH_USER: admin

  KEYCLOAK_URL: http://keycloak.ai-soc.svc.cluster.local:8080/auth
  KEYCLOAK_REALM: ai-soc
  KEYCLOAK_CLIENT_ID: ai-soc-platform

  JWT_ALGORITHM: RS256
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"

  API_GATEWAY_HOST: "0.0.0.0"
  API_GATEWAY_PORT: "8000"
  CORS_ORIGINS: https://aisoc.example.com

  LLM_PROVIDER: ollama
  OLLAMA_MODEL: llama3.1:8b
  EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
  EMBEDDING_DIMENSIONS: "384"

  NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ai-soc-frontend

  SMTP_PORT: "587"
  SMTP_FROM: noreply@aisoc.example.com

  SOAR_SIMULATION_MODE: "false"
  SOAR_APPROVAL_REQUIRED: "true"

  RATE_LIMIT_EVENTS_PER_MINUTE: "1000"
  RATE_LIMIT_API_PER_MINUTE: "300"
  RATE_LIMIT_AI_PER_MINUTE: "30"
