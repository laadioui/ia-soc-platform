apiVersion: v1
kind: Secret
metadata:
  name: ai-soc-secrets
  namespace: ai-soc
  labels:
    app.kubernetes.io/part-of: ai-soc-platform
type: Opaque
stringData:
  postgres-password: CHANGE_ME_postgres_password
  redis-password: CHANGE_ME_redis_password
  opensearch-password: CHANGE_ME_opensearch_password
  keycloak-admin-password: CHANGE_ME_keycloak_admin_password
  jwt-secret-key: CHANGE_ME_jwt_secret_key_at_least_32_chars
  keycloak-client-secret: CHANGE_ME_keycloak_client_secret
  smtp-password: ""
