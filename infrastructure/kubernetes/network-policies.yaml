  namespace: ai-soc
  labels:
    app.kubernetes.io/part-of: ai-soc-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: detection
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: correlation
      ports:
