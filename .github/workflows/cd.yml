name: CD Pipeline

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/soc-platform

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build Release Images
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all services
        run: |
          for service in collector-service detection-service correlation-service ai-service notification-service; do
            echo "Building $service ${{ steps.version.outputs.version }}"
            docker build \
              --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --build-arg VCS_REF="${{ github.sha }}" \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service}:${{ steps.version.outputs.version }} \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service}:latest \
              -f services/${service}/Dockerfile .
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service}:${{ steps.version.outputs.version }}
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service}:latest
          done

  security-scan:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - collector-service
          - detection-service
          - correlation-service
          - ai-service
          - notification-service
    steps:
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ needs.build.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Trivy SBOM generation
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ needs.build.outputs.version }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json

  deploy-staging:
    name: Deploy to Staging
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.soc-platform.internal
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Update images
        run: |
          TAG="${{ needs.build.outputs.version }}"
          for deployment in collector detection-engine correlation-engine ai-engine notification-service; do
            svc=$(echo "$deployment" | sed 's/-engine//')
            kubectl set image deployment/${deployment} \
              ${deployment}=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${svc}:${TAG} \
              --namespace=soc-staging
          done

      - name: Wait for rollout
        run: |
          for deployment in collector detection-engine correlation-engine ai-engine notification-service; do
            kubectl rollout status deployment/${deployment} --namespace=soc-staging --timeout=600s
          done

      - name: Validate staging
        run: |
          for i in $(seq 1 30); do
            if curl -sf https://staging.soc-platform.internal/health; then
              echo "Staging is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Staging health check failed"
          exit 1

  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://soc-platform.internal
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: ArgoCD sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          TAG="${{ needs.build.outputs.version }}"

          argocd app set soc-platform-backend \
            -p image.tag="${TAG}" \
            --server "${ARGOCD_SERVER}" \
            --auth-token "${ARGOCD_AUTH_TOKEN}" \
            --insecure

          argocd app sync soc-platform-backend \
            --server "${ARGOCD_SERVER}" \
            --auth-token "${ARGOCD_AUTH_TOKEN}" \
            --insecure \
            --timeout 600

          argocd app set soc-platform-frontend \
            -p image.tag="${TAG}" \
            --server "${ARGOCD_SERVER}" \
            --auth-token "${ARGOCD_AUTH_TOKEN}" \
            --insecure

          argocd app sync soc-platform-frontend \
            --server "${ARGOCD_SERVER}" \
            --auth-token "${ARGOCD_AUTH_TOKEN}" \
            --insecure \
            --timeout 600

      - name: Wait for production rollout
        run: |
          for deployment in collector detection-engine correlation-engine ai-engine notification-service frontend; do
            kubectl rollout status deployment/${deployment} --namespace=soc-production --timeout=600s
          done

      - name: Validate production
        run: |
          for i in $(seq 1 30); do
            if curl -sf https://soc-platform.internal/health; then
              echo "Production is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Production health check failed"
          exit 1

      - name: Create GitHub deployment status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment.id,
              state: 'success',
              environment_url: 'https://soc-platform.internal'
            });
