name: Security Scanning

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast:
    name: SAST - Static Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run semgrep - Python rules
        env:
          SEMGREP_RULES: >-
            p/python
            p/fastapi
            p/django
            p/flask
            p/owasp-top-ten
            p/security-audit
            p/secrets
            p/dockerfile
            p/github-actions
        run: semgrep scan --config auto --sarif --output sast-results.sarif .

      - name: Upload SAST results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sast-results.sarif
          category: sast-semgrep

  dast:
    name: DAST - Dynamic Analysis
    runs-on: ubuntu-latest
    needs: [deploy-preview]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health; then
              echo "API is ready"
              break
            fi
            sleep 5
          done

      - name: Run OWASP ZAP scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: http://localhost:8000
          rules_file_name: ".zap/rules.tsv"
          cmd_options: >-
            -a
            -j
            -l WARN
            -z "-config api.disablekey=true"
            -r dast-report.html
            -x dast-report.xml

      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: |
            dast-report.html
            dast-report.xml

      - name: Convert to SARIF
        if: always()
        run: |
          pip install zapv2
          python -c "
          import xml.etree.ElementTree as ET
          import json
          tree = ET.parse('dast-report.xml')
          # Basic conversion - in production use a proper converter
          print('DAST scan completed. Review HTML report for details.')
          "

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - collector-service
          - detection-service
          - correlation-service
          - ai-service
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - name: Build image locally
        run: |
          docker build \
            -t soc/${{ matrix.service }}:scan \
            -f services/${{ matrix.service }}/Dockerfile .

      - name: Trivy scan - vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: soc/${{ matrix.service }}:scan
          format: sarif
          output: trivy-vuln-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Trivy scan - misconfigurations
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: soc/${{ matrix.service }}:scan
          format: sarif
          scan-type: config
          output: trivy-config-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH

      - name: Trivy scan - secrets
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: soc/${{ matrix.service }}:scan
          format: sarif
          scan-type: image
          scanners: secret
          output: trivy-secret-${{ matrix.service }}.sarif

      - name: Upload container scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-vuln-${{ matrix.service }}.sarif
          category: trivy-vuln-${{ matrix.service }}

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install pip-audit safety

      - name: Python dependency audit
        run: |
          FINDINGS=0
          for req_file in $(find services -name "requirements.txt"); do
            echo "=== Auditing $req_file ==="
            pip-audit -r "$req_file" --severity critical --desc || FINDINGS=$((FINDINGS + 1))
          done
          exit $FINDINGS

      - name: Check for known vulnerabilities
        run: |
          for req_file in $(find services -name "requirements.txt"); do
            echo "=== Safety check $req_file ==="
            safety check -r "$req_file" --output json --output-file safety-report.json || true
          done

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Scan for hardcoded credentials
        run: |
          echo "Scanning for hardcoded secrets patterns..."
          rg -l --no-filename '(password|secret|api_key|token)\s*[:=]\s*["\x27][^"\x27]{8,}' \
            --type py --type js --type ts \
            --glob '!*.example' \
            --glob '!*.test.*' \
            --glob '!tests/*' \
            || echo "No hardcoded secrets found"

      - name: Scan for high-entropy strings
        run: |
          rg '[a-zA-Z0-9+/]{40,}={0,2}' \
            --type py \
            --glob '!tests/*' \
            --glob '!*.example' \
            -n || echo "No high-entropy strings found"

  license-scan:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-licenses
        run: pip install pip-licenses

      - name: Check licenses
        run: |
          BLOCKED="GPL-3.0 AGPL-3.0 SSPL-1.0 EUPL-1.2"
          for req_file in $(find services -name "requirements.txt"); do
            echo "=== Checking licenses in $req_file ==="
            pip install -r "$req_file" --quiet 2>/dev/null || true
            pip-licenses --from=mixed --format=json --output-file=licenses.json || true

            for license in $BLOCKED; do
              if grep -q "$license" licenses.json 2>/dev/null; then
                echo "WARNING: Found blocked license $license in $req_file"
                exit 1
              fi
            done
          done
          echo "All licenses compliant"
