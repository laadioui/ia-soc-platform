apiVersion: apps/v1
kind: Deployment
metadata:
  name: correlation
  namespace: ai-soc
  labels:
    app.kubernetes.io/name: correlation
    app.kubernetes.io/component: correlation-engine
    app.kubernetes.io/part-of: ai-soc-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: correlation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: correlation
        app.kubernetes.io/component: correlation-engine
        app.kubernetes.io/part-of: ai-soc-platform
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka 9092; do echo "Waiting for kafka..."; sleep 2; done
              echo "Kafka ready!"
      containers:
        - name: correlation
          image: ai-soc-platform/correlation:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: ai-soc-config
            - secretRef:
                name: ai-soc-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
      tolerations:
        - key: workload
          operator: Equal
          value: correlation
          effect: NoSchedule
