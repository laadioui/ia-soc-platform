name: Security Scanning

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run semgrep
        run: semgrep scan --config p/generic --config p/python --sarif --output sast-results.sarif . || true

      - name: Upload SAST results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sast-results.sarif
          category: sast-semgrep

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Container Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        service:
          - collector-service
          - detection-service
          - ai-service
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - name: Build image locally
        run: |
          docker build -t soc/${{ matrix.service }}:scan -f services/${{ matrix.service }}/Dockerfile .

      - name: Trivy scan - vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: soc/${{ matrix.service }}:scan
          format: sarif
          output: trivy-vuln-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload container scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-vuln-${{ matrix.service }}.sarif
          category: trivy-vuln-${{ matrix.service }}

  dependency-scan:
    name: Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Python dependency audit
        run: |
          for req_file in $(find services -name "requirements.txt"); do
            echo "=== Auditing $req_file ==="
            pip-audit -r "$req_file" --severity critical --desc || true
          done
