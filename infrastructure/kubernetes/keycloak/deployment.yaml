apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: ai-soc
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: ai-soc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: ai-soc-platform
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0
          args:
            - start
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/aisoc
            - name: KC_DB_USERNAME
              value: aisoc
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-soc-secrets
                  key: postgres-password
            - name: KC_HOSTNAME
              value: "keycloak.ai-soc.svc.cluster.local"
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-soc-secrets
                  key: keycloak-admin-password
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /auth/health/alive
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      tolerations:
        - key: workload
          operator: Equal
          value: identity
          effect: NoSchedule
