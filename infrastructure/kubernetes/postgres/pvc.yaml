apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ai-soc
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ai-soc-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 50Gi
