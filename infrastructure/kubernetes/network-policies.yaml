---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-internal
  namespace: ai-soc
  labels:
    app.kubernetes.io/part-of: ai-soc-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zookeeper
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: detection
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: correlation
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka-init
      ports:
        - port: 9092
          protocol: TCP
        - port: 29092
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
