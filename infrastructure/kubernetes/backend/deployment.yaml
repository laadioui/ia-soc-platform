apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-soc
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: ai-soc-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api-gateway
        app.kubernetes.io/part-of: ai-soc-platform
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo "Waiting for postgres..."; sleep 2; done
              until nc -z redis 6379; do echo "Waiting for redis..."; sleep 2; done
              until nc -z kafka 9092; do echo "Waiting for kafka..."; sleep 2; done
              echo "All dependencies ready!"
      containers:
        - name: backend
          image: ai-soc-platform/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: ai-soc-config
            - secretRef:
                name: ai-soc-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
      tolerations:
        - key: workload
          operator: Equal
          value: api
          effect: NoSchedule
