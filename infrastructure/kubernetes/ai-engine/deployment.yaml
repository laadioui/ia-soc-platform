apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine
  namespace: ai-soc
  labels:
    app.kubernetes.io/name: ai-engine
    app.kubernetes.io/component: ml-engine
    app.kubernetes.io/part-of: ai-soc-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-engine
        app.kubernetes.io/component: ml-engine
        app.kubernetes.io/part-of: ai-soc-platform
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo "Waiting for postgres..."; sleep 2; done
              echo "Postgres ready!"
      containers:
        - name: ai-engine
          image: ai-soc-platform/ai-engine:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: ai-soc-config
            - secretRef:
                name: ai-soc-secrets
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ai-soc.svc.cluster.local:11434"
            - name: EMBEDDING_MODEL
              value: "sentence-transformers/all-MiniLM-L6-v2"
            - name: EMBEDDING_DIMENSIONS
              value: "384"
          resources:
            requests:
              cpu: 1
              memory: 2Gi
            limits:
              cpu: 4
              memory: 8Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
